<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSC3210 Puzzle Pandemonium</title>
    <meta name="viewport" content=" width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1b1d23;
      }
      canvas {
        display: block;
      }
      #label {
        position: fixed;
        top: 12px;
        left: 16px;
        font-family: sans-serif;
        color: #eee;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.35);
        padding: 6px 10px;
        border-radius: 4px;
      }
    </style>
  </head>

  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const CONFIG = {
        octagon: {
          radius: 280,
          sides: 8,
          rotationOffset: Math.PI / 8,
          color: 0xffffff,
          lineWidth: 3,
        },
        puzzleArea: {
          width: 550,
          height: 0,
          color: 0x2c2f3a,
          borderColor: 0x4a4e5c,
        },
        trayArea: {
          color: 0x22242c,
          borderColor: 0x3a3d47,
        },
        background: 0x1b1d23,
      };

      const PIECES_CONFIG = {
        totalPieces: 10,
        innerRadiusRatio: 0.5,
        twist: Math.PI / 8,
        trayScale: 0.35,
        snapDistance: 60,
        colors: [
          0xe76f51, 0xf4a261, 0x2a9d8f, 0xe9c46a, 0x457b9d, 0xa8dadc, 0xf28482,
          0x84a59d, 0xf6bd60, 0x6d597a,
        ],
      };

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(CONFIG.background);

      let camera;
      function makeCamera() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera = new THREE.OrthographicCamera(
          -w / 2,
          w / 2,
          h / 2,
          -h / 2,
          0.1,
          1000
        );
        camera.position.z = 10;
      }
      makeCamera();

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      const layoutGroup = new THREE.Group();
      scene.add(layoutGroup);

      function makeRect(width, height, fillColor, borderColor) {
        const group = new THREE.Group();

        const fillGeom = new THREE.PlaneGeometry(width, height);
        const fillMat = new THREE.MeshBasicMaterial({ color: fillColor });
        const fill = new THREE.Mesh(fillGeom, fillMat);
        group.add(fill);

        const hw = width / 2;
        const hh = height / 2;
        const borderPoints = [
          new THREE.Vector3(-hw, -hh, 0.01),
          new THREE.Vector3(hw, -hh, 0.01),
          new THREE.Vector3(hw, hh, 0.01),
          new THREE.Vector3(-hw, hh, 0.01),
          new THREE.Vector3(-hw, -hh, 0.01),
        ];

        const borderGeom = new THREE.BufferGeometry().setFromPoints(
          borderPoints
        );
        const borderMat = new THREE.LineBasicMaterial({ color: borderColor });
        group.add(new THREE.Line(borderGeom, borderMat));

        return group;
      }

      function buildLayout() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        layoutGroup.clear();

        const puzzleCenterY = h * 0.08;
        const puzzleRect = makeRect(
          CONFIG.puzzleArea.width,
          CONFIG.puzzleArea.height,
          CONFIG.puzzleArea.color,
          CONFIG.puzzleArea.borderColor
        );
        puzzleRect.position.set(0, puzzleCenterY, 0);
        if (CONFIG.puzzleArea.height > 0) layoutGroup.add(puzzleRect);

        const trayHeight = Math.max(100, h * 0.2);
        const trayWidth = w * 0.9;
        const trayCenterY = -h / 2 + trayHeight / 2 + 20;
        const trayRect = makeRect(
          trayWidth,
          trayHeight,
          CONFIG.trayArea.color,
          CONFIG.trayArea.borderColor
        );
        trayRect.position.set(0, trayCenterY, 0);
        layoutGroup.add(trayRect);

        return {
          puzzleCenter: new THREE.Vector2(0, puzzleCenterY),
          trayCenter: new THREE.Vector2(0, trayCenterY),
          trayBounds: { width: trayWidth, height: trayHeight },
        };
      }

      let layout = buildLayout();

      function computeOctagonVertices(radius, sides, rotationOffset) {
        const verts = [];
        for (let i = 0; i < sides; i++) {
          const angle = rotationOffset + (i / sides) * Math.PI * 2;
          verts.push(
            new THREE.Vector2(
              radius * Math.cos(angle),
              radius * Math.sin(angle)
            )
          );
        }
        return verts;
      }

      function buildOctagonOutline(centerY) {
        const verts = computeOctagonVertices(
          CONFIG.octagon.radius,
          CONFIG.octagon.sides,
          CONFIG.octagon.rotationOffset
        );

        const points = verts.map(
          (v) => new THREE.Vector3(v.x, v.y + centerY, 0.02)
        );
        points.push(points[0].clone());

        const geom = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({
          color: CONFIG.octagon.color,
          linewidth: CONFIG.octagon.lineWidth,
        });
        const outline = new THREE.Line(geom, mat);

        return { outline, verts };
      }

      const octagonGroup = new THREE.Group();
      scene.add(octagonGroup);

      function rebuildOctagon() {
        octagonGroup.clear();
        const { outline } = buildOctagonOutline(layout.puzzleCenter.y);
        octagonGroup.add(outline);
      }

      rebuildOctagon();

      function buildPuzzlePieces() {
        const n = CONFIG.octagon.sides;

        const outer = computeOctagonVertices(
          CONFIG.octagon.radius,
          n,
          CONFIG.octagon.rotationOffset
        );

        const innerRadius =
          CONFIG.octagon.radius * PIECES_CONFIG.innerRadiusRatio;
        const inner = [];

        for (let i = 0; i < n; i++) {
          const angle =
            CONFIG.octagon.rotationOffset +
            PIECES_CONFIG.twist +
            (i / n) * Math.PI * 2;

          const randomRadius = innerRadius * (0.8 + Math.random() * 0.4);

          inner.push(
            new THREE.Vector2(
              randomRadius * Math.cos(angle),
              randomRadius * Math.sin(angle)
            )
          );
        }

        const pieceShapes = [];

        for (let i = 0; i < n; i++) {
          const next = (i + 1) % n;
          pieceShapes.push([
            outer[i].clone(),
            outer[next].clone(),
            inner[next].clone(),
            inner[i].clone(),
          ]);
        }

        const half = n / 2;

        const pentagonA = [];
        for (let i = 0; i <= half; i++) {
          pentagonA.push(inner[i % n].clone());
        }
        pieceShapes.push(pentagonA);

        const pentagonB = [];
        for (let i = half; i <= n; i++) pentagonB.push(inner[i % n].clone());
        pieceShapes.push(pentagonB);

        return pieceShapes;
      }

      class PuzzlePiece {
        constructor(id, localVertices, color) {
          this.id = id;
          this.localVertices = localVertices;
          this.color = color;
          this.group = new THREE.Group();
          this.group.userData.piece = this;
          this._buildMesh();
        }

        _buildMesh() {
          const shape = new THREE.Shape(this.localVertices);
          const fillGeom = new THREE.ShapeGeometry(shape);
          const fillMat = new THREE.MeshBasicMaterial({
            color: this.color,
            side: THREE.DoubleSide,
          });
          this.group.add(new THREE.Mesh(fillGeom, fillMat));

          const outlinePts = this.localVertices.map(
            (v) => new THREE.Vector3(v.x, v.y, 0.01)
          );

          outlinePts.push(outlinePts[0].clone());
          const outlineGeom = new THREE.BufferGeometry().setFromPoints(
            outlinePts
          );

          const outlineMat = new THREE.LineBasicMaterial({ color: 0x0c0d10 });
          this.group.add(new THREE.Line(outlineGeom, outlineMat));
        }

        setPosition(x, y) {
          this.group.position.set(x, y, 0);
        }
      }

      let pieces = [];
      const piecesGroup = new THREE.Group();
      scene.add(piecesGroup);
      function buildPlacePieces() {
        piecesGroup.clear();
        pieces = [];

        const shapes = buildPuzzlePieces();

        const startRadius = Math.min(
          CONFIG.octagon.radius + 100,
          Math.min(window.innerWidth, window.innerHeight) * 0.42
        );

        shapes.forEach((verts, i) => {
          const piece = new PuzzlePiece(
            i,
            verts,
            PIECES_CONFIG.colors[i % PIECES_CONFIG.colors.length]
          );

          piece.group.scale.setScalar(PIECES_CONFIG.trayScale);

          piece.snapTarget = new THREE.Vector3(0, layout.puzzleCenter.y, 0);

          const angle = (i / shapes.length) * Math.PI * 2;

          piece.setPosition(
            Math.cos(angle) * startRadius,
            layout.puzzleCenter.y + Math.sin(angle) * startRadius
          );

          piecesGroup.add(piece.group);
          pieces.push(piece);
        });
      }

      buildPlacePieces();

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
      const dragPoint = new THREE.Vector3();
      let draggedPiece = null;
      let dragOffset = new THREE.Vector3();

      function updatePointerPosition(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      }

      renderer.domElement.addEventListener("pointerdown", (event) => {
        updatePointerPosition(event);
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(piecesGroup.children, true);
        if (!hits.length) return;

        let pieceGroup = hits[0].object;
        while (pieceGroup.parent && pieceGroup.parent !== piecesGroup) {
          pieceGroup = pieceGroup.parent;
        }

        draggedPiece = pieceGroup.userData.piece;
        if (
          !draggedPiece ||
          !raycaster.ray.intersectPlane(dragPlane, dragPoint)
        ) {
          draggedPiece = null;
          return;
        }

        draggedPiece.group.scale.setScalar(1);
        dragOffset.copy(draggedPiece.group.position).sub(dragPoint);
        renderer.domElement.setPointerCapture(event.pointerId);
      });

      renderer.domElement.addEventListener("pointermove", (event) => {
        if (!draggedPiece) return;
        updatePointerPosition(event);
        raycaster.setFromCamera(pointer, camera);
        if (raycaster.ray.intersectPlane(dragPlane, dragPoint)) {
          draggedPiece.group.position.copy(dragPoint).add(dragOffset);
        }
      });

      renderer.domElement.addEventListener("pointerup", (event) => {
        if (draggedPiece) {
          const distanceToTarget = draggedPiece.group.position.distanceTo(
            draggedPiece.snapTarget
          );
          if (distanceToTarget <= PIECES_CONFIG.snapDistance) {
            draggedPiece.group.position.copy(draggedPiece.snapTarget);
          }
        }
        draggedPiece = null;
        if (renderer.domElement.hasPointerCapture(event.pointerId)) {
          renderer.domElement.releasePointerCapture(event.pointerId);
        }
      });

      window.addEventListener("resize", () => {
        const w = window.innerWidth;
        const h = window.innerHeight;

        camera.left = -w / 2;
        camera.right = w / 2;
        camera.top = h / 2;
        camera.bottom = -h / 2;
        camera.updateProjectionMatrix();

        renderer.setSize(w, h);

        layout = buildLayout();
        rebuildOctagon();
        buildPlacePieces();
      });
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
